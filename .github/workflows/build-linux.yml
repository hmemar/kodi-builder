name: 🐧 Build Husham Play (Linux x86_64)

on:
  workflow_dispatch:
    inputs:
      kodi_tag:
        description: 'Upstream Omega tag'
        required: true
        default: '21.3-Omega'
      create_release:
        description: 'Publish as a GitHub Release?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build:
    name: Linux x86_64 (${{ github.event.inputs.kodi_tag }})
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      PREFIX: /opt/husham-play
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (docs/README.Ubuntu.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake autopoint gettext autotools-dev cmake curl default-jre gawk gcc g++ gperf libasound2-dev libass-dev libavahi-client-dev libavahi-common-dev libbluetooth-dev libbluray-dev libbz2-dev libcdio-dev libp8-platform-dev libcrossguid-dev libcurl4-openssl-dev libcwiid-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev libenca-dev libflac-dev libfmt-dev libfontconfig-dev libfreetype6-dev libfribidi-dev libfstrcmp-dev libgcrypt-dev libgif-dev libgles2-mesa-dev libgl1-mesa-dev libglu1-mesa-dev libgnutls28-dev libgpg-error-dev libiso9660-dev libjpeg-dev liblcms2-dev libltdl-dev liblzo2-dev libmicrohttpd-dev libnfs-dev libogg-dev libpcre3-dev libplist-dev libpng-dev libpulse-dev libshairplay-dev libsmbclient-dev libspdlog-dev libsqlite3-dev libssl-dev libtag1-dev libtiff5-dev libtinyxml-dev libtinyxml2-dev libtool libtool-bin libudev-dev libunistring-dev libva-dev libvdpau-dev libvorbis-dev libxmu-dev libxrandr-dev libxslt1-dev libxt-dev lsb-release meson nasm ninja-build python3-dev python3-pil python3-pip rapidjson-dev swig unzip uuid-dev zip zlib1g-dev libcec-dev liblirc-dev libflatbuffers-dev libmysqlclient-dev libdav1d-dev ccache

      - name: Clone upstream source
        run: git clone --depth 1 -b "${{ github.event.inputs.kodi_tag }}" https://github.com/xbmc/xbmc.git "$HOME/kodi"

      - name: Apply Husham Play branding
        run: |
          export HUSHAM_PLATFORM=linux
          python3 scripts/brand-desktop.py "$HOME/kodi" kodi-config "$HOME/brand" linux

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: linux-ccache-${{ github.event.inputs.kodi_tag }}-${{ github.run_id }}
          restore-keys: linux-ccache-${{ github.event.inputs.kodi_tag }}-

      - name: Configure
        run: |
          mkdir -p "$HOME/build" && cd "$HOME/build"
          cmake "$HOME/kodi" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCORE_PLATFORM_NAME=x11 -DAPP_RENDER_SYSTEM=gl \
            -DENABLE_INTERNAL_FFMPEG=ON -DENABLE_INTERNAL_CROSSGUID=ON \
            -DENABLE_INTERNAL_FSTRCMP=ON -DENABLE_INTERNAL_UDFREAD=ON \
            -DENABLE_INTERNAL_FLATBUFFERS=ON -DENABLE_INTERNAL_SPDLOG=ON -DENABLE_INTERNAL_FMT=ON \
            -DENABLE_INTERNAL_EXIV2=ON -DENABLE_INTERNAL_TAGLIB=ON -DENABLE_INTERNAL_NFS=ON \
            -DENABLE_TESTING=OFF -DENABLE_CCACHE=ON

      - name: Build
        run: |
          export CCACHE_DIR=$HOME/.ccache
          cd "$HOME/build" && cmake --build . -j"$(nproc)"

      - name: Install, binary add-ons, package tarball
        id: pkg
        run: |
          set -euo pipefail
          cd "$HOME/build"
          DESTDIR="$HOME/stage" cmake --install .
          ROOT="$HOME/stage$PREFIX"
          # Build official binary add-ons from source (no Linux zips on the Omega mirror)
          mkdir -p "$HOME/binadd"
          set +e
          cmake "$HOME/kodi/cmake/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ROOT" \
            -DADDONS_TO_BUILD="pvr.iptvsimple inputstream.adaptive inputstream.ffmpegdirect inputstream.rtmp" \
            -DPACKAGE_ZIP=OFF \
            -DBUILD_DIR="$HOME/binadd" \
            > "$HOME/binadd-cmake.log" 2>&1
          CMAKE_RC=$?
          set -e
          if [ $CMAKE_RC -eq 0 ]; then
            cmake --build "$HOME/binadd" -j"$(nproc)" > "$HOME/binadd-build.log" 2>&1 || {
              echo "Binary add-on build had errors; continuing with python add-ons only"
              tail -80 "$HOME/binadd-build.log" || true
            }
          else
            echo "Binary add-on cmake configure failed; users can install PVR from the official repo"
            tail -80 "$HOME/binadd-cmake.log" || true
          fi
          # Copy any built addons into tree and register
          if [ -d "$ROOT/share/kodi/addons" ]; then
            for d in "$HOME/kodi/addons"/plugin.* "$HOME/kodi/addons"/script.* \
                     "$HOME/kodi/addons"/service.* "$HOME/kodi/addons"/weather.* \
                     "$HOME/kodi/addons"/skin.husham.play "$HOME/kodi/addons"/pvr.* \
                     "$HOME/kodi/addons"/inputstream.*; do
              [ -e "$d" ] || continue
              cp -a "$d" "$ROOT/share/kodi/addons/" 2>/dev/null || true
            done
            if [ -f "$ROOT/share/kodi/system/addon-manifest.xml" ]; then
              for d in "$ROOT/share/kodi/addons"/plugin.* "$ROOT/share/kodi/addons"/script.* \
                       "$ROOT/share/kodi/addons"/service.* "$ROOT/share/kodi/addons"/weather.* \
                       "$ROOT/share/kodi/addons"/skin.husham.play "$ROOT/share/kodi/addons"/pvr.* \
                       "$ROOT/share/kodi/addons"/inputstream.*; do
                [ -e "$d" ] || continue
                aid=$(basename "$d")
                if ! grep -q "<addon>${aid}</addon>" "$ROOT/share/kodi/system/addon-manifest.xml"; then
                  sed -i "s|</addons>|  <addon>${aid}</addon>\n</addons>|" "$ROOT/share/kodi/system/addon-manifest.xml"
                fi
              done
            fi
            mkdir -p "$ROOT/share/kodi/userdata"
            cp "$HOME/kodi/userdata/"*.xml "$ROOT/share/kodi/userdata/" 2>/dev/null || true
          fi
          cat > "$ROOT/husham-play" <<'SH'
          #!/bin/sh
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export KODI_HOME="$HERE/share/kodi"
          export KODI_BIN_HOME="$HERE/lib/kodi"
          exec "$HERE/lib/kodi/kodi-x11" "$@"
          SH
          sed -i 's/^          //' "$ROOT/husham-play"
          chmod +x "$ROOT/husham-play"
          cp "$HOME/brand/icon.png" "$ROOT/husham-play.png"
          cat > "$ROOT/husham-play.desktop" <<'D'
          [Desktop Entry]
          Type=Application
          Name=Husham Play
          Comment=Husham Play player
          Exec=/opt/husham-play/husham-play
          Icon=/opt/husham-play/husham-play.png
          Categories=AudioVideo;Video;Player;
          D
          sed -i 's/^          //' "$ROOT/husham-play.desktop"
          rm -f "$ROOT/share/applications/"*.desktop
          cat > "$ROOT/README-HUSHAM-PLAY.txt" <<'R'
          Husham Play 1.1 for Linux x86_64 (built on Ubuntu 22.04)
          Install:  sudo tar -xJf Husham-Play-1.1-linux-x86_64.tar.xz -C /opt
                    cp /opt/husham-play/husham-play.desktop ~/.local/share/applications/
          Run:      /opt/husham-play/husham-play
          Needs the runtime libraries of Ubuntu 22.04+/Debian 12.
          Based on open-source software licensed GPL-2.0-or-later.
          Source: https://github.com/hmemar/kodi-builder and https://github.com/xbmc/xbmc
          Husham Play is not affiliated with or endorsed by the XBMC Foundation / Kodi Foundation.
          Husham Play provides no content — only use services and media you have the right to access.
          R
          sed -i 's/^          //' "$ROOT/README-HUSHAM-PLAY.txt"
          cp "$HOME/kodi/LICENSE.md" "$ROOT/LICENSE.md" 2>/dev/null || true
          cd "$HOME/stage/opt"
          tar -cJf "$HOME/Husham-Play-1.1-linux-x86_64.tar.xz" husham-play
          ls -la "$HOME/Husham-Play-1.1-linux-x86_64.tar.xz"
          echo "file=$HOME/Husham-Play-1.1-linux-x86_64.tar.xz" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Husham-Play-1.1-linux-x86_64
          path: ${{ steps.pkg.outputs.file }}

      - name: Publish release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-linux-${{ github.run_number }}
          name: "Husham Play 1.1 — Linux x86_64 — Build #${{ github.run_number }}"
          body: |
            ## Husham Play 1.1 for Linux (x86_64)
            Extract to /opt: `sudo tar -xJf Husham-Play-1.1-linux-x86_64.tar.xz -C /opt`, then run `/opt/husham-play/husham-play`.
            Built on Ubuntu 22.04; needs the matching runtime libraries.

            Pre-configured with legal official add-ons, Husham companion add-on and Husham Play skin. Provides no content.
            Binary PVR/InputStream add-ons are built when the Linux binary-addon step succeeds; otherwise install IPTV Simple Client from the official repository after first launch.

            Based on open-source software licensed GPL-2.0-or-later. Source: this repository and upstream [xbmc/xbmc](https://github.com/xbmc/xbmc) (`${{ github.event.inputs.kodi_tag }}`).
            Husham Play is not affiliated with or endorsed by the XBMC Foundation / Kodi Foundation.
          files: ${{ steps.pkg.outputs.file }}
