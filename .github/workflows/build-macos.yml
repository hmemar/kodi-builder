name: 🍎 Build Husham Play (macOS)

on:
  workflow_dispatch:
    inputs:
      kodi_tag:
        description: 'Upstream Omega tag'
        required: true
        default: '21.3-Omega'
      arch:
        description: 'CPU architecture'
        required: true
        default: 'arm64'
        type: choice
        options: ['arm64', 'x86_64']
      create_release:
        description: 'Publish as a GitHub Release?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ github.event.inputs.arch }} (${{ github.event.inputs.kodi_tag }})
    runs-on: ${{ github.event.inputs.arch == 'arm64' && 'macos-14' || 'macos-13' }}
    timeout-minutes: 350
    env:
      DEPENDS: ${{ github.workspace }}/../xbmc-depends
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install autoconf automake libtool pkg-config gettext nasm || true
          python3 -m pip install --break-system-packages --quiet pillow || python3 -m pip install --quiet pillow
          xcodebuild -version

      - name: Clone upstream source
        run: git clone --depth 1 -b "${{ github.event.inputs.kodi_tag }}" https://github.com/xbmc/xbmc.git "$HOME/kodi"

      - name: Apply Husham Play branding
        run: |
          PLATFORM=${{ github.event.inputs.arch == 'arm64' && 'osx-arm64' || 'osx-x86_64' }}
          export HUSHAM_PLATFORM=$PLATFORM
          python3 scripts/brand-desktop.py "$HOME/kodi" kodi-config "$HOME/brand" "$PLATFORM"
          IS="$HOME/kodi/tools/darwin/packaging/media/osx/icon.iconset"
          for f in "$IS"/*.png; do
            px=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            sips -z $px $px "$HOME/brand/icon.png" --out "$f" >/dev/null
          done
          echo "iconset replaced"

      - name: Build depends
        run: |
          HOST=${{ github.event.inputs.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          cd "$HOME/kodi/tools/depends"
          ./bootstrap
          ./configure --host=$HOST --with-platform=macos --prefix="$HOME/xbmc-depends"
          make -j"$(sysctl -n hw.ncpu)" > "$HOME/depends.log" 2>&1 || { tail -200 "$HOME/depends.log"; exit 1; }
          tail -5 "$HOME/depends.log"

      - name: Generate and build
        run: |
          make -C "$HOME/kodi/tools/depends/target/cmakebuildsys" BUILD_DIR="$HOME/kodi-build"
          cd "$HOME/kodi-build"
          make -j"$(sysctl -n hw.ncpu)" > "$HOME/build.log" 2>&1 || { tail -200 "$HOME/build.log"; exit 1; }
          tail -5 "$HOME/build.log"

      - name: Bundle app
        run: |
          cd "$HOME/kodi-build"
          make dmg > "$HOME/dmg.log" 2>&1 || { tail -100 "$HOME/dmg.log"; }
          APP=$(find "$HOME/kodi-build" -maxdepth 5 -name "Kodi.app" -type d | head -1)
          [ -n "$APP" ] || { tail -100 "$HOME/dmg.log"; exit 1; }
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Rebrand and make unsigned dmg
        id: pkg
        run: |
          OUT="$HOME/out"; mkdir -p "$OUT"
          ditto "$APP" "$OUT/Husham Play.app"
          # Ensure userdata defaults + addons from branded source are in the app bundle
          RES="$OUT/Husham Play.app/Contents/Resources/Kodi"
          if [ -d "$HOME/kodi/addons" ] && [ -d "$RES/addons" ]; then
            for d in "$HOME/kodi/addons"/plugin.* "$HOME/kodi/addons"/script.* \
                     "$HOME/kodi/addons"/service.* "$HOME/kodi/addons"/weather.* \
                     "$HOME/kodi/addons"/pvr.* "$HOME/kodi/addons"/inputstream.* \
                     "$HOME/kodi/addons"/skin.husham.play; do
              [ -e "$d" ] || continue
              cp -a "$d" "$RES/addons/" 2>/dev/null || true
            done
          fi
          if [ -d "$RES/userdata" ]; then
            cp "$HOME/kodi/userdata/"*.xml "$RES/userdata/" 2>/dev/null || true
          fi
          PL="$OUT/Husham Play.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Husham Play" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleName string Husham Play" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Husham Play" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Husham Play" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.husham.media" "$PL" || true
          codesign --force --deep -s - "$OUT/Husham Play.app" || true
          cat > "$OUT/README-HUSHAM-PLAY.txt" <<'R'
          Husham Play 1.1 for macOS (unsigned)
          Drag "Husham Play" to Applications. First launch: right-click > Open, or run
            xattr -dr com.apple.quarantine "/Applications/Husham Play.app"
          Based on open-source software licensed GPL-2.0-or-later.
          Source: https://github.com/hmemar/kodi-builder and https://github.com/xbmc/xbmc
          Husham Play is not affiliated with or endorsed by the XBMC Foundation / Kodi Foundation.
          Husham Play provides no content — only use services and media you have the right to access.
          R
          ln -s /Applications "$OUT/Applications"
          DMG="$HOME/Husham-Play-1.1-macos-${{ github.event.inputs.arch }}.dmg"
          hdiutil create -volname "Husham Play" -srcfolder "$OUT" -ov -format UDZO "$DMG"
          ls -la "$DMG"
          echo "file=$DMG" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Husham-Play-1.1-macos-${{ github.event.inputs.arch }}
          path: ${{ steps.pkg.outputs.file }}

      - name: Publish release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-macos-${{ github.event.inputs.arch }}-${{ github.run_number }}
          name: "Husham Play 1.1 — macOS ${{ github.event.inputs.arch }} — Build #${{ github.run_number }}"
          body: |
            ## Husham Play 1.1 for macOS (${{ github.event.inputs.arch }}, unsigned)
            Open the dmg, drag Husham Play to Applications, then right-click → Open the first time (it isn't notarised).

            Pre-configured with legal official add-ons, IPTV Simple Client (no playlist), Husham companion add-on and Husham Play skin. Provides no content.

            Based on open-source software licensed GPL-2.0-or-later. Source: this repository and upstream [xbmc/xbmc](https://github.com/xbmc/xbmc) (`${{ github.event.inputs.kodi_tag }}`).
            Husham Play is not affiliated with or endorsed by the XBMC Foundation / Kodi Foundation.
          files: ${{ steps.pkg.outputs.file }}
