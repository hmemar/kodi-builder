name: 🪟 Build Husham Play (Windows x64)

on:
  workflow_dispatch:
    inputs:
      kodi_tag:
        description: 'Upstream Omega tag'
        required: true
        default: '21.3-Omega'
      create_release:
        description: 'Publish as a GitHub Release?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 (${{ github.event.inputs.kodi_tag }})
    runs-on: windows-2022
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream source
        shell: bash
        run: git clone --depth 1 -b "${{ github.event.inputs.kodi_tag }}" https://github.com/xbmc/xbmc.git /c/kodi

      - name: Apply Husham Play branding
        shell: bash
        run: |
          python -m pip install --quiet pillow
          export HUSHAM_PLATFORM=windows-x86_64
          python scripts/brand-desktop.py /c/kodi kodi-config /c/brand windows-x86_64
          cp /c/brand/icon.ico /c/kodi/tools/windows/packaging/media/application.ico

      - name: Download prebuilt dependencies
        shell: cmd
        run: |
          cd /d C:\kodi\tools\buildsteps\windows\x64
          call download-dependencies.bat

      - name: Download msys2
        shell: cmd
        run: |
          cd /d C:\kodi\tools\buildsteps\windows\x64
          call download-msys2.bat

      - name: Build mingw libs (ffmpeg etc.)
        shell: cmd
        run: |
          cd /d C:\kodi\tools\buildsteps\windows\x64
          call make-mingwlibs.bat noprompt

      - name: Build and assemble (BuildSetup)
        shell: cmd
        continue-on-error: true
        run: |
          cd /d C:\kodi\tools\buildsteps\windows\x64
          call BuildSetup.bat noprompt nobinaryaddons clean

      - name: Package portable zip
        id: pkg
        shell: pwsh
        run: |
          $app = "C:\kodi\project\Win32BuildSetup\BUILD_WIN32\application"
          if (-not (Test-Path "$app\kodi.exe")) { Get-ChildItem C:\kodi\project\Win32BuildSetup -Recurse -Depth 2 | Select -First 50; throw "application folder not built" }
          Rename-Item "$app\kodi.exe" "Husham Play.exe"
          Copy-Item "$env:GITHUB_WORKSPACE\kodi-config\sources.xml","$env:GITHUB_WORKSPACE\kodi-config\advancedsettings.xml","$env:GITHUB_WORKSPACE\kodi-config\favourites.xml" "$app\userdata\" -Force -ErrorAction SilentlyContinue
          # Ensure branded addons from source tree are present in application\addons
          if (Test-Path "C:\kodi\addons") {
            Get-ChildItem "C:\kodi\addons" -Directory | ForEach-Object {
              $dest = Join-Path "$app\addons" $_.Name
              if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest -Recurse -Force }
            }
          }
          New-Item -ItemType Directory "$app\portable_data" -Force | Out-Null
          @"
          Husham Play 1.1 for Windows x64 (portable)
          Unzip anywhere and run "Husham Play.exe". Settings live in portable_data\ when started with -p,
          e.g. create a shortcut: "Husham Play.exe" -p
          Based on open-source software licensed GPL-2.0-or-later.
          Source: https://github.com/hmemar/kodi-builder and https://github.com/xbmc/xbmc
          Husham Play is not affiliated with or endorsed by the XBMC Foundation / Kodi Foundation.
          Husham Play provides no content — only use services and media you have the right to access.
          "@ | Set-Content "$app\README-HUSHAM-PLAY.txt"
          Set-Content "$app\Husham Play (portable).bat" '@start "" "%~dp0Husham Play.exe" -p'
          $parent = Split-Path $app
          Rename-Item $app "Husham Play"
          $zip = "C:\Husham-Play-1.1-windows-x64-portable.zip"
          Compress-Archive -Path "$parent\Husham Play" -DestinationPath $zip
          Get-Item $zip | Format-List Name,Length
          "file=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Husham-Play-1.1-windows-x64
          path: ${{ steps.pkg.outputs.file }}

      - name: Publish release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-windows-${{ github.run_number }}
          name: "Husham Play 1.1 — Windows x64 — Build #${{ github.run_number }}"
          body: |
            ## Husham Play 1.1 for Windows (x64, portable)
            Unzip and run `Husham Play.exe` (or `Husham Play (portable).bat` to keep settings in the folder). Unsigned, so SmartScreen will grumble: More info → Run anyway.

            Pre-configured with legal official add-ons, IPTV Simple Client (no playlist), Husham companion add-on and Husham Play skin. Provides no content.

            Based on open-source software licensed GPL-2.0-or-later. Source: this repository and upstream [xbmc/xbmc](https://github.com/xbmc/xbmc) (`${{ github.event.inputs.kodi_tag }}`).
            Husham Play is not affiliated with or endorsed by the XBMC Foundation / Kodi Foundation.
          files: ${{ steps.pkg.outputs.file }}
